  // PARTICLES SYSTEM — Fondo dinámico con partículas flotantes
  // ============================================================
  (function initParticles() {
    const canvas = document.getElementById('particles-canvas');
    if (!canvas) return;
    const ctx = canvas.getContext('2d');
    let particles = [];
    let animId = null;
    const PARTICLE_COUNT = 50;

    function resize() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }

    function createParticle() {
      return {
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        size: Math.random() * 2 + 0.5,
        speedX: (Math.random() - 0.5) * 0.4,
        speedY: (Math.random() - 0.5) * 0.3,
        opacity: Math.random() * 0.5 + 0.1,
        hue: Math.random() * 60 + 200, // azul-violeta
      };
    }

    function init() {
      resize();
      particles = [];
      for (let i = 0; i < PARTICLE_COUNT; i++) {
        particles.push(createParticle());
      }
    }

    function drawParticle(p) {
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
      ctx.fillStyle = 'hsla(' + p.hue + ', 70%, 70%, ' + p.opacity + ')';
      ctx.fill();
    }

    function connectParticles() {
      for (let i = 0; i < particles.length; i++) {
        for (let j = i + 1; j < particles.length; j++) {
          var dx = particles[i].x - particles[j].x;
          var dy = particles[i].y - particles[j].y;
          var dist = Math.sqrt(dx * dx + dy * dy);
          if (dist < 120) {
            ctx.beginPath();
            ctx.strokeStyle = 'hsla(220, 70%, 70%, ' + (0.08 * (1 - dist / 120)) + ')';
            ctx.lineWidth = 0.5;
            ctx.moveTo(particles[i].x, particles[i].y);
            ctx.lineTo(particles[j].x, particles[j].y);
            ctx.stroke();
          }
        }
      }
    }

    function animate() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      particles.forEach(function(p) {
        p.x += p.speedX;
        p.y += p.speedY;
        if (p.x < 0 || p.x > canvas.width) p.speedX *= -1;
        if (p.y < 0 || p.y > canvas.height) p.speedY *= -1;
        drawParticle(p);
      });
      connectParticles();
      animId = requestAnimationFrame(animate);
    }

    window.addEventListener('resize', resize);
    init();
    animate();
  })();

  // ============================================================
  // MERMAID RENDERER
  // ============================================================
  const MermaidRenderer = {
    _idCounter: 0,
    _initialized: false,

    async initialize(config) {
      if (this._initialized) return;
      try {
        mermaid.initialize({
          startOnLoad: false,
          theme: 'dark',
          securityLevel: 'loose',
          fontFamily: '"Fira Code", "Cascadia Code", monospace',
          ...config,
        });
        this._initialized = true;
      } catch (err) {
        console.error('Error al inicializar Mermaid.js:', err);
      }
    },

    _generateId() {
      this._idCounter += 1;
      return 'mmd-' + this._idCounter + '-' + Date.now();
    },

    async render(id, code) {
      if (!this._initialized) return { success: false, error: 'Mermaid no inicializado' };
      const uid = id || this._generateId();
      try {
        const { svg } = await mermaid.render(uid, code.trim());
        return { success: true, svg: svg };
      } catch (err) {
        return { success: false, error: 'Error de sintaxis: ' + (err.message || err) };
      }
    },

    async renderAllInContainer(container) {
      if (!container) return;
      const els = container.querySelectorAll('[data-mermaid]');
      for (const el of els) {
        const code = el.getAttribute('data-mermaid');
        if (!code) continue;
        const result = await this.render(this._generateId(), code);
        if (result.success) {
          el.innerHTML = result.svg;
          const alt = el.getAttribute('data-mermaid-alt');
          const svg = el.querySelector('svg');
          if (svg && alt) { svg.setAttribute('role', 'img'); svg.setAttribute('aria-label', alt); }
        } else {
          el.innerHTML = '<div class="mermaid-error" role="alert">' + escapeHtml(result.error) + '</div>';
        }
      }
    }
  };

  // ============================================================
  // NAVIGATOR
  // ============================================================
  function createNavigator(totalSlides, onSlideChange) {
    let currentIndex = 0;
    const btnPrev = document.getElementById('btn-previous');
    const btnNext = document.getElementById('btn-next');
    const progressText = document.getElementById('progress-text');
    const progressBar = document.getElementById('progress-bar-fill');

    function canGoNext() { return currentIndex < totalSlides - 1; }
    function canGoPrev() { return currentIndex > 0; }

    function updateButtons() {
      if (btnPrev) btnPrev.disabled = !canGoPrev();
      if (btnNext) btnNext.disabled = !canGoNext();
    }

    function updateProgress() {
      const display = (currentIndex + 1) + ' / ' + totalSlides;
      if (progressText) progressText.textContent = display;
      if (progressBar) { progressBar.value = currentIndex + 1; progressBar.max = totalSlides; }
    }

    function emitChange(direction) {
      updateButtons();
      updateProgress();
      onSlideChange(currentIndex, direction);
    }

    function next() { if (canGoNext()) { currentIndex++; emitChange('forward'); } }
    function previous() { if (canGoPrev()) { currentIndex--; emitChange('backward'); } }
    function goTo(index) {
      if (index < 0 || index >= totalSlides || index === currentIndex) return;
      const dir = index > currentIndex ? 'forward' : 'backward';
      currentIndex = index;
      emitChange(dir);
    }

    // Keyboard
    document.addEventListener('keydown', function(e) {
      const tag = (e.target.tagName || '').toLowerCase();
      if (tag === 'textarea' || tag === 'input' || e.target.isContentEditable) return;
      if (e.key === 'ArrowRight') { e.preventDefault(); next(); }
      if (e.key === 'ArrowLeft') { e.preventDefault(); previous(); }
    });

    // Buttons
    if (btnPrev) btnPrev.addEventListener('click', previous);
    if (btnNext) btnNext.addEventListener('click', next);

    updateButtons();
    updateProgress();

    return { next: next, previous: previous, goTo: goTo, canGoNext: canGoNext, canGoPrev: canGoPrev, updateProgress: updateProgress, getCurrentIndex: function() { return currentIndex; } };
  }

  // ============================================================
  // HELPERS
  // ============================================================
  function escapeHtml(str) {
    if (!str) return '';
    var d = document.createElement('div');
    d.textContent = str;
    return d.innerHTML;
  }

  function escapeAttr(str) {
    if (!str) return '';
    return str.replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/'/g,'&#39;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  function highlightSyntax(code) {
    if (!code) return '';
    var e = escapeHtml(code);
    e = e.replace(/\b(graph|flowchart|sequenceDiagram|classDiagram|stateDiagram-v2|stateDiagram|gantt|erDiagram|pie|gitGraph|journey|mindmap)\b/g, '<span class="syntax-keyword">$1</span>');
    e = e.replace(/\b(subgraph|end|participant|actor|class|section|title|dateFormat|loop|alt|else|opt|par|note|over|activate|deactivate)\b/g, '<span class="syntax-structure">$1</span>');
    e = e.replace(/(--&gt;|---|-\.-&gt;|==&gt;|--&gt;\|[^|]*\||&lt;\|--|--o|--x)/g, '<span class="syntax-arrow">$1</span>');
    return e;
  }

  function buildBullets(points) {
    if (!points || !points.length) return '';
    return '<ul class="bullet-list">' + points.map(function(p) {
      return '<li class="bullet-item animate-in">' + escapeHtml(p) + '</li>';
    }).join('') + '</ul>';
  }

  // ============================================================
  // SLIDE RENDERER
  // ============================================================
  function buildSlideHtml(slide) {
    switch (slide.type) {
      case 'title':
        return '<div class="slide__inner slide__inner--title">' +
          '<h1 class="slide__title slide__title--hero animate-in">' + escapeHtml(slide.title) + '</h1>' +
          (slide.subtitle ? '<p class="slide__subtitle animate-in">' + escapeHtml(slide.subtitle) + '</p>' : '') +
          (slide.content ? '<div class="slide__body animate-in">' + slide.content + '</div>' : '') +
          '</div>';

      case 'index':
        var items = (slide.indexItems || []).map(function(item, i) {
          return '<li class="index-item animate-in"><a href="#" class="index-link" data-target-id="' + escapeAttr(item.targetId) + '" tabindex="0"><span class="index-number">' + (i+1) + '</span><span class="index-label">' + escapeHtml(item.label) + '</span></a></li>';
        }).join('');
        return '<div class="slide__inner slide__inner--index"><h2 class="slide__title animate-in">' + escapeHtml(slide.title) + '</h2><ol class="index-list">' + items + '</ol></div>';

      case 'diagram':
        return '<div class="slide__inner slide__inner--diagram">' +
          '<div class="slide__text-panel">' +
          (slide.section ? '<span class="slide__section-badge animate-in">' + escapeHtml(slide.section) + '</span>' : '') +
          '<h2 class="slide__title animate-in">' + escapeHtml(slide.title) + '</h2>' +
          (slide.content ? '<div class="slide__body animate-in">' + slide.content + '</div>' : '') +
          '</div>' +
          '<div class="slide__diagram-area animate-in">' +
          '<div class="code-panel"><div class="code-panel__header">Código Mermaid</div><pre class="code-block"><code>' + highlightSyntax(slide.mermaidCode) + '</code></pre></div>' +
          '<div class="diagram-preview" data-mermaid="' + escapeAttr(slide.mermaidCode) + '" data-mermaid-alt="' + escapeAttr(slide.mermaidAltText || '') + '"></div>' +
          '</div></div>';

      case 'interactive':
        return '<div class="slide__inner slide__inner--interactive">' +
          '<div class="slide__header">' +
          (slide.section ? '<span class="slide__section-badge animate-in">' + escapeHtml(slide.section) + '</span>' : '') +
          '<h2 class="slide__title animate-in">' + escapeHtml(slide.title) + '</h2>' +
          (slide.content ? '<div class="slide__body animate-in">' + slide.content + '</div>' : '') +
          '</div>' +
          '<div class="interactive-editor-mount animate-in"></div>' +
          '</div>';

      case 'closing':
        var res = (slide.resources || []).map(function(r) {
          var parts = r.split(' — ');
          var url = parts[0].trim();
          var label = parts.length > 1 ? parts[1].trim() : url;
          return '<li class="resource-item animate-in"><a href="' + escapeAttr(url) + '" target="_blank" rel="noopener noreferrer">' + escapeHtml(url) + '</a> — ' + escapeHtml(label) + '</li>';
        }).join('');
        return '<div class="slide__inner slide__inner--closing">' +
          '<h2 class="slide__title slide__title--hero animate-in">' + escapeHtml(slide.title) + '</h2>' +
          (slide.content ? '<div class="slide__body animate-in">' + slide.content + '</div>' : '') +
          buildBullets(slide.bulletPoints) +
          (res ? '<div class="resources-section animate-in"><h3 class="resources-title">Recursos</h3><ul class="resources-list">' + res + '</ul></div>' : '') +
          '</div>';

      default: // content
        var hasDiagram = !!slide.mermaidCode;
        var left = '<div class="slide__text-panel">' +
          (slide.section ? '<span class="slide__section-badge animate-in">' + escapeHtml(slide.section) + '</span>' : '') +
          '<h2 class="slide__title animate-in">' + escapeHtml(slide.title) + '</h2>' +
          (slide.content ? '<div class="slide__body animate-in">' + slide.content + '</div>' : '') +
          buildBullets(slide.bulletPoints) +
          (slide.footerHtml ? '<div class="animate-in">' + slide.footerHtml + '</div>' : '') +
          '</div>';
        var right = '';
        if (hasDiagram) {
          right = '<div class="slide__diagram-panel animate-in">' +
            '<div class="code-panel"><pre class="code-block"><code>' + highlightSyntax(slide.mermaidCode) + '</code></pre></div>' +
            '<div class="diagram-preview" data-mermaid="' + escapeAttr(slide.mermaidCode) + '" data-mermaid-alt="' + escapeAttr(slide.mermaidAltText || '') + '"></div>' +
            '</div>';
        }
        return '<div class="slide__inner' + (hasDiagram ? ' slide__inner--split' : '') + '">' + left + right + '</div>';
    }
  }

  // ============================================================
  // INTERACTIVE EDITOR
  // ============================================================
  var editorState = { mounted: false, textarea: null, preview: null, initialCode: '', timer: null };

  function destroyEditor() {
    if (editorState.timer) clearTimeout(editorState.timer);
    editorState.mounted = false;
    editorState.textarea = null;
    editorState.preview = null;
  }

  async function mountEditor(container, code) {
    destroyEditor();
    editorState.initialCode = code;
    editorState.mounted = true;
    container.innerHTML = '';
    container.classList.add('interactive-editor');

    var editorPanel = document.createElement('div');
    editorPanel.className = 'editor-panel';
    editorPanel.innerHTML = '<div class="editor-panel__header"><span class="editor-panel__title">Editor de Código Mermaid</span><button type="button" class="editor-restore-btn" aria-label="Restaurar código original">&#8634; Restaurar</button></div>';

    var ta = document.createElement('textarea');
    ta.className = 'editor-textarea';
    ta.value = code;
    ta.setAttribute('spellcheck', 'false');
    ta.setAttribute('rows', '12');
    ta.setAttribute('aria-label', 'Editor de código Mermaid');
    editorPanel.appendChild(ta);
    editorState.textarea = ta;

    var previewPanel = document.createElement('div');
    previewPanel.className = 'preview-panel';
    previewPanel.innerHTML = '<div class="preview-panel__header">Vista Previa</div>';
    var previewContent = document.createElement('div');
    previewContent.className = 'preview-panel__content';
    previewPanel.appendChild(previewContent);
    editorState.preview = previewContent;

    container.appendChild(editorPanel);
    container.appendChild(previewPanel);

    // Render initial
    var result = await MermaidRenderer.render(null, code);
    if (result.success) { previewContent.innerHTML = result.svg; }
    else { previewContent.innerHTML = '<div class="mermaid-error">' + escapeHtml(result.error) + '</div>'; }

    // Input with debounce
    ta.addEventListener('input', function() {
      if (editorState.timer) clearTimeout(editorState.timer);
      editorState.timer = setTimeout(async function() {
        var c = ta.value || '';
        if (!c.trim()) { previewContent.innerHTML = '<div class="editor-placeholder">Escribe código Mermaid</div>'; return; }
        var r = await MermaidRenderer.render(null, c);
        if (r.success) { previewContent.innerHTML = r.svg; previewContent.classList.remove('preview-panel__content--error'); }
        else { previewContent.innerHTML = '<div class="mermaid-error">' + escapeHtml(r.error) + '</div>'; previewContent.classList.add('preview-panel__content--error'); }
      }, 300);
    });

    // Restore button
    var restoreBtn = editorPanel.querySelector('.editor-restore-btn');
    if (restoreBtn) {
      restoreBtn.addEventListener('click', async function() {
        ta.value = editorState.initialCode;
        var r = await MermaidRenderer.render(null, editorState.initialCode);
        if (r.success) { previewContent.innerHTML = r.svg; previewContent.classList.remove('preview-panel__content--error'); }
        else { previewContent.innerHTML = '<div class="mermaid-error">' + escapeHtml(r.error) + '</div>'; }
      });
    }
  }

  // ============================================================
  // ACCESSIBILITY
  // ============================================================
  var liveRegion = null;

  function setupLiveRegion(container) {
    var region = document.createElement('div');
    region.id = 'slide-announcer';
    region.setAttribute('aria-live', 'polite');
    region.setAttribute('aria-atomic', 'true');
    region.setAttribute('role', 'status');
    region.className = 'sr-only';
    container.appendChild(region);
    liveRegion = region;
  }

  function announceSlide(title, index, total) {
    if (!liveRegion) return;
    liveRegion.textContent = '';
    requestAnimationFrame(function() {
      if (liveRegion) liveRegion.textContent = 'Diapositiva ' + (index + 1) + ' de ' + total + ': ' + title;
    });
  }

  function setupNavAria(prevBtn, nextBtn, canPrev, canNext) {
    if (prevBtn) { prevBtn.setAttribute('aria-label', 'Diapositiva anterior'); prevBtn.setAttribute('aria-disabled', String(!canPrev)); }
    if (nextBtn) { nextBtn.setAttribute('aria-label', 'Siguiente diapositiva'); nextBtn.setAttribute('aria-disabled', String(!canNext)); }
  }

  // ============================================================
  // MAIN INIT
  // ============================================================
  document.addEventListener('DOMContentLoaded', async function() {
    var container = document.getElementById('slide-container');
    var presentation = document.getElementById('presentation');
    var btnPrev = document.getElementById('btn-previous');
    var btnNext = document.getElementById('btn-next');

    if (!container || !presentation) return;

    await MermaidRenderer.initialize({ theme: 'dark' });
    setupLiveRegion(presentation);

    // Build slide id -> index map
    var idMap = {};
    slides.forEach(function(s, i) { idMap[s.id] = i; });

    var slideNav; // forward declaration

    async function renderSlide(index, direction) {
      var slide = slides[index];
      if (!slide) return;

      destroyEditor();

      var wrapper = document.createElement('div');
      wrapper.className = 'slide slide--' + slide.type;
      wrapper.innerHTML = buildSlideHtml(slide);

      var enterClass = direction === 'backward' ? 'slide-enter-backward' : 'slide-enter-forward';
      wrapper.classList.add(enterClass);

      container.innerHTML = '';
      container.appendChild(wrapper);

      // Index links
      if (slide.type === 'index' && slideNav) {
        wrapper.querySelectorAll('.index-link').forEach(function(link) {
          link.addEventListener('click', function(e) {
            e.preventDefault();
            var tid = link.getAttribute('data-target-id');
            if (tid && idMap[tid] !== undefined) slideNav.goTo(idMap[tid]);
          });
        });
      }

      // Render mermaid diagrams
      if (slide.mermaidCode && !slide.isInteractive) {
        await MermaidRenderer.renderAllInContainer(wrapper);
      }

      // Mount interactive editor
      if (slide.isInteractive && slide.mermaidCode) {
        var mount = wrapper.querySelector('.interactive-editor-mount');
        if (mount) await mountEditor(mount, slide.mermaidCode);
      }

      // Animate in
      requestAnimationFrame(function() {
        wrapper.classList.remove(enterClass);
        wrapper.classList.add('slide-active');
        var animEls = wrapper.querySelectorAll('.animate-in');
        animEls.forEach(function(el, i) {
          el.style.animationDelay = (i * 100) + 'ms';
          el.classList.add('animate-in--active');
        });
      });

      announceSlide(slide.title, index, slides.length);
      setupNavAria(btnPrev, btnNext, slideNav ? slideNav.canGoPrev() : false, slideNav ? slideNav.canGoNext() : true);
    }

    slideNav = createNavigator(slides.length, function(index, direction) {
      renderSlide(index, direction);
    });

    // ── Touch/Swipe support para móvil ──────────────
    var touchStartX = 0;
    var touchStartY = 0;
    var touchEndX = 0;
    var touchEndY = 0;
    var isSwiping = false;

    container.addEventListener('touchstart', function(e) {
      touchStartX = e.changedTouches[0].screenX;
      touchStartY = e.changedTouches[0].screenY;
      isSwiping = true;
    }, { passive: true });

    container.addEventListener('touchend', function(e) {
      if (!isSwiping) return;
      touchEndX = e.changedTouches[0].screenX;
      touchEndY = e.changedTouches[0].screenY;
      var diffX = touchStartX - touchEndX;
      var diffY = touchStartY - touchEndY;
      // Solo swipe horizontal si es mayor que vertical
      if (Math.abs(diffX) > Math.abs(diffY) && Math.abs(diffX) > 50) {
        if (diffX > 0) { slideNav.next(); }
        else { slideNav.previous(); }
      }
      isSwiping = false;
    }, { passive: true });

    // Render first slide
    await renderSlide(0, 'forward');
  });
  </script>
</body>
</html>
